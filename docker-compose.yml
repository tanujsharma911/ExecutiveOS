services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: executiveos-app
    restart: unless-stopped
    ports:
      - "7461:7461"
    env_file:
      - .env
    environment:
      - PORT=7461

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: executiveos-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

  # Optional local Postgres container (use only if not using Neon: docker compose --profile local-db up)
  postgres:
    profiles:
      - local-db
    image: postgres:16-alpine
    container_name: executiveos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-executiveos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-executiveos}
      POSTGRES_DB: ${POSTGRES_DB:-executiveos}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - executiveos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-executiveos} -d ${POSTGRES_DB:-executiveos}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  executiveos-pg:
