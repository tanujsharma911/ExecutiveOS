# Render Blueprint: one web service (API + built web app) and one Postgres database.
# Render → New → Blueprint → pick this repo. Values marked "sync: false" are asked for when you create it.
services:
  - type: web
    name: executiveos
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --prefix server --include=dev && npm ci --prefix web --include=dev && npm --prefix web run build
    preDeployCommand: npm --prefix server run db:migrate
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: executiveos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # APP_URL defaults to Render's public URL (RENDER_EXTERNAL_URL). Set it only if you add a custom domain.
      - key: SHOW_DEMO_ACCOUNTS
        value: "true"
      - key: DETERMINISTIC_FALLBACK
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PAYPAL_ENV
        value: sandbox
      - key: SUBSCRIPTION_SYNC_MINUTES
        value: "60"
      - key: LOG_LEVEL
        value: info
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VITE_BRYNTUM_LICENSE_KEY
        sync: false
      - key: VITE_AG_GRID_LICENSE_KEY
        sync: false

databases:
  - name: executiveos-db
    plan: basic-256mb
    region: oregon
    databaseName: executiveos
    user: executiveos
    postgresMajorVersion: "16"
